<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0B09">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus Horizon - Recuperar senha</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@200;300;400;500;600;700&display=swap');
    :root {
      --bg-primary: #0D0B09;
      --bg-card: rgba(18, 16, 14, 0.88);
      --gold: #D4AF37;
      --gold-light: #F0D68A;
      --gold-dark: #B8942E;
      --champagne: #F5E6CC;
      --warm-white: #EDE6D9;
      --warm-gray: #8B8580;
      --muted: #5C5650;
      --subtle-border: rgba(212, 175, 55, 0.12);
      --success: #2ECC71;
      --danger: #E74C3C;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    html { background: var(--bg-primary); min-height: 100%; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg-primary); color: var(--warm-white); font-family: var(--font-body); min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; overscroll-behavior: none; -webkit-overflow-scrolling: touch; background-image: radial-gradient(ellipse at 50% 0%, rgba(212, 175, 55, 0.03) 0%, transparent 70%); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: var(--bg-primary); }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 2px; }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    @keyframes fadeIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:translateY(0); } }
    .container { width: 100%; max-width: 420px; }
    .logo { margin-bottom: 40px; text-align: center; }
    .logo h1 { font-family: var(--font-heading); font-size: 48px; font-weight: 700; letter-spacing: 6px; background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 30%, var(--gold-light) 50%, var(--gold) 70%, var(--gold-dark) 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 3s linear infinite; }
    .logo .submark { font-family: var(--font-heading); font-size: 14px; font-style: italic; color: var(--warm-gray); letter-spacing: 4px; margin-top: -4px; }
    .logo .separator { width: 40px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); margin: 12px auto; }
    .logo p { font-size: 12px; color: var(--muted); letter-spacing: 3px; margin-top: 8px; text-transform: uppercase; font-weight: 300; }
    .card { background: var(--bg-card); backdrop-filter: blur(24px); border: 1px solid var(--subtle-border); border-radius: 24px; padding: 32px; box-shadow: inset 0 1px 0 rgba(212, 175, 55, 0.06), 0 12px 56px rgba(0,0,0,0.6); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .card::after { content: ''; position: absolute; bottom: 0; left: 40px; right: 40px; height: 1px; background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.15), transparent); }
    .title { font-family: var(--font-heading); font-size: 20px; font-weight: 600; color: var(--gold-light); margin-bottom: 10px; }
    .description { margin-bottom: 20px; color: var(--warm-gray); font-size: 13px; line-height: 1.6; font-weight: 300; }
    .label { font-size: 9px; letter-spacing: 3px; margin-bottom: 8px; margin-top: 20px; display: block; color: var(--gold); font-weight: 600; text-transform: uppercase; }
    .label:first-of-type { margin-top: 0; }
    input { width: 100%; background: rgba(13, 11, 9, 0.8); border: 1px solid var(--subtle-border); border-radius: 14px; padding: 14px 18px; color: var(--warm-white); font-size: 15px; outline: none; transition: all 0.35s ease; font-family: var(--font-body); }
    input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.08), 0 0 24px rgba(212, 175, 55, 0.06); background: rgba(13, 11, 9, 0.95); }
    input::placeholder { color: var(--muted); }
    .password-field { position: relative; display: flex; align-items: center; }
    .password-field input { padding-right: 92px; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--gold); font-size: 10px; font-weight: 600; letter-spacing: 1px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: all 0.3s; }
    .password-toggle:hover { color: var(--gold-light); background: rgba(212, 175, 55, 0.08); }
    .btn-primary { width: 100%; background: linear-gradient(135deg, var(--gold-dark) 0%, var(--gold) 50%, var(--gold-light) 100%); background-size: 200% auto; color: #0D0B09; border: none; border-radius: 14px; padding: 16px; font-size: 12px; font-weight: 700; letter-spacing: 3px; cursor: pointer; margin-top: 24px; transition: all 0.4s ease; position: relative; overflow: hidden; box-shadow: 0 4px 24px rgba(212, 175, 55, 0.3), inset 0 1px 0 rgba(255,255,255,0.3); font-family: var(--font-body); text-transform: uppercase; }
    .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none !important; }
    .btn-primary::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent); transition: left 0.6s ease; }
    .btn-primary:hover { background-position: right center; box-shadow: 0 8px 40px rgba(212, 175, 55, 0.4); transform: translateY(-1px); }
    .btn-primary:hover::before { left: 100%; }
    .error { background: rgba(231, 76, 60, 0.08); border: 1px solid rgba(231, 76, 60, 0.3); border-radius: 12px; padding: 14px; color: var(--danger); font-size: 13px; margin-top: 16px; display: none; animation: fadeIn 0.3s ease; }
    .success { background: rgba(46, 204, 113, 0.08); border: 1px solid rgba(46, 204, 113, 0.3); border-radius: 12px; padding: 14px; color: var(--success); font-size: 13px; margin-top: 16px; display: none; line-height: 1.6; word-break: break-word; animation: fadeIn 0.3s ease; }
    .link { text-align: center; margin-top: 20px; font-size: 13px; color: var(--muted); cursor: pointer; font-weight: 300; transition: color 0.3s ease; }
    .link:hover { color: var(--gold); }
    @keyframes modalIn { from { opacity:0; transform:scale(0.96) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
    .modal-overlay { position: fixed; inset: 0; z-index: 99999; background: rgba(8, 7, 6, 0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 24px; animation: overlayIn 0.3s ease; }
    .modal-overlay.closing { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .modal-box { background: var(--bg-card); backdrop-filter: blur(32px); border: 1px solid var(--subtle-border); border-radius: 24px; max-width: 440px; width: 100%; padding: 0; box-shadow: inset 0 1px 0 rgba(212, 175, 55, 0.06), 0 24px 80px rgba(0,0,0,0.7); position: relative; overflow: hidden; animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-box.closing { opacity: 0; transform: scale(0.96) translateY(12px); transition: all 0.3s ease; pointer-events: none; }
    .modal-box::before { content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
    .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--subtle-border); background: rgba(13, 11, 9, 0.6); color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s; }
    .modal-close:hover { border-color: var(--gold-border); color: var(--gold); background: rgba(212, 175, 55, 0.06); }
    .modal-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 32px auto 0; font-size: 24px; border: 1px solid var(--subtle-border); }
    .modal-icon.success { background: rgba(46, 204, 113, 0.08); border-color: rgba(46, 204, 113, 0.3); color: var(--success); }
    .modal-icon.error { background: rgba(231, 76, 60, 0.08); border-color: rgba(231, 76, 60, 0.3); color: var(--danger); }
    .modal-icon.warning { background: rgba(241, 196, 15, 0.08); border-color: rgba(241, 196, 15, 0.3); color: var(--warning); }
    .modal-icon.info { background: rgba(212, 175, 55, 0.08); border-color: rgba(212, 175, 55, 0.3); color: var(--gold); }
    .modal-body { padding: 24px 32px 32px; text-align: center; }
    .modal-title { font-family: var(--font-heading); font-size: 22px; font-weight: 600; color: var(--gold-light); margin-top: 16px; margin-bottom: 8px; line-height: 1.3; }
    .modal-message { font-size: 14px; color: var(--warm-gray); line-height: 1.7; font-weight: 300; margin-bottom: 24px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-actions .btn-primary { margin-top: 0; flex: 1; }
    .modal-actions .btn-secondary { margin-top: 0; flex: 1; }
    @media (max-width: 600px) { .logo h1 { font-size: 32px; letter-spacing: 4px; } .card { padding: 24px; } .modal-body { padding: 20px 24px 24px; } .modal-title { font-size: 18px; } .modal-icon { width: 48px; height: 48px; font-size: 20px; margin-top: 28px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <div class="submark">Horizon</div>
      <div class="separator"></div>
      <p>Recuperação de senha</p>
    </div>

    <div class="card">
      <h3 class="title" id="pageTitle">Receber link de redefinição</h3>
      <p class="description" id="pageDescription">Informe seu email cadastrado para receber o link de redefinição.</p>

      <div id="emailField">
        <label class="label">EMAIL</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>

      <div id="passwordFields" style="display:none">
        <label class="label">NOVA SENHA</label>
        <div class="password-field">
          <input type="password" id="password" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">Mostrar</button>
        </div>
        <label class="label">CONFIRMAR SENHA</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">Mostrar</button>
        </div>
      </div>

      <div class="error" id="errorMessage"></div>
      <div class="success" id="successMessage"></div>

      <button class="btn-primary" id="submitBtn" onclick="handlePasswordRecovery()">ENVIAR LINK</button>
      <p class="link" onclick="goToLogin()">Voltar ao login</p>
    </div>
  </div>

  <script>
    const API = `${window.location.origin}/api`
    const resetToken = new URLSearchParams(window.location.search).get('token')

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId)
      if (!input || !button) return
      const shouldShow = input.type === 'password'
      input.type = shouldShow ? 'text' : 'password'
      button.textContent = shouldShow ? 'Ocultar' : 'Mostrar'
    }

    function goToLogin() { window.location.href = 'index.html' }

    if (resetToken) {
      document.getElementById('pageTitle').textContent = 'Redefinir senha'
      document.getElementById('pageDescription').textContent = 'Digite sua nova senha para concluir a redefinição.'
      document.getElementById('emailField').style.display = 'none'
      document.getElementById('passwordFields').style.display = 'block'
      document.getElementById('submitBtn').textContent = 'REDEFINIR SENHA'
    }

    async function handlePasswordRecovery() {
      const errorEl = document.getElementById('errorMessage')
      const successEl = document.getElementById('successMessage')
      const btn = document.getElementById('submitBtn')

      errorEl.style.display = 'none'
      successEl.style.display = 'none'
      btn.disabled = true
      btn.textContent = resetToken ? 'SALVANDO...' : 'ENVIANDO...'

      try {
        if (resetToken) {
          const password = document.getElementById('password').value.trim()
          const confirmPassword = document.getElementById('confirmPassword').value.trim()
          if (!password || !confirmPassword) throw new Error('Preencha todos os campos.')
          if (password.length < 6) throw new Error('A senha deve ter pelo menos 6 caracteres.')
          if (password !== confirmPassword) throw new Error('As senhas não conferem.')
          const res = await fetch(`${API}/auth/reset-password`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Falha ao redefinir a senha.')
          successEl.textContent = data.message || 'Senha redefinida com sucesso.'
          successEl.style.display = 'block'
          btn.textContent = 'REDEFINIR SENHA'
          setTimeout(goToLogin, 2000)
          return
        }

        const email = document.getElementById('email').value.trim().toLowerCase()
        if (!email) throw new Error('Informe seu email.')

        const res = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha ao enviar o link de redefinição.')

        successEl.textContent = data.resetLink
          ? `Link de desenvolvimento gerado: ${data.resetLink}`
          : (data.message || 'Verifique sua caixa de entrada.')
        successEl.style.display = 'block'
        if (data.resetLink && navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(data.resetLink).catch(() => {})
        }
        btn.textContent = 'ENVIAR LINK'
      } catch (error) {
        errorEl.textContent = error.message
        errorEl.style.display = 'block'
        btn.textContent = resetToken ? 'REDEFINIR SENHA' : 'ENVIAR LINK'
      } finally {
        btn.disabled = false
      }
    }

    document.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') handlePasswordRecovery()
    })

    var MODAL_ICONS = { success: '&#10003;', error: '&#10007;', warning: '&#9888;', info: '&#9670;', confirm: '&#63;' }
    function showModal(options) {
      var type = options.type || 'info', title = options.title || '', message = options.message || ''
      var existing = document.querySelector('.modal-overlay'); if (existing) existing.remove()
      var iconHtml = '<div class="modal-icon ' + type + '">' + (MODAL_ICONS[type] || MODAL_ICONS.info) + '</div>'
      var actionsHtml = type === 'confirm'
        ? '<div class="modal-actions"><button class="btn-secondary" id="modalCancelBtn">' + (options.cancelText || 'Cancelar') + '</button><button class="btn-primary" id="modalConfirmBtn">' + (options.confirmText || 'Confirmar') + '</button></div>'
        : '<div class="modal-actions"><button class="btn-primary" id="modalOkBtn">OK</button></div>'
      var overlay = document.createElement('div')
      overlay.className = 'modal-overlay'
      overlay.innerHTML = '<div class="modal-box">' + (options.showClose !== false ? '<button class="modal-close" id="modalCloseBtn">&times;</button>' : '') + iconHtml + '<div class="modal-body"><div class="modal-title">' + title + '</div><div class="modal-message">' + message + '</div>' + actionsHtml + '</div></div>'
      document.body.appendChild(overlay)
      function closeModal() {
        overlay.classList.add('closing')
        var box = overlay.querySelector('.modal-box'); if (box) box.classList.add('closing')
        setTimeout(function () { overlay.remove(); if (options.onClose) options.onClose() }, 350)
      }
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal() })
      setTimeout(function () {
        var cb = document.getElementById('modalCloseBtn'); if (cb) cb.addEventListener('click', closeModal)
        var ob = document.getElementById('modalOkBtn'); if (ob) ob.addEventListener('click', closeModal)
        var cfb = document.getElementById('modalConfirmBtn'); if (cfb) cfb.addEventListener('click', function () { if (options.onConfirm) options.onConfirm(); closeModal() })
        var clb = document.getElementById('modalCancelBtn'); if (clb) clb.addEventListener('click', closeModal)
      }, 0)
    }
  </script>
</body>
</html>
