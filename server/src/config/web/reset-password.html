<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0A0A0A">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus Horizon - Recuperar senha</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
    html { background: #0A0A0A; min-height: 100%; }
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #0A0A0A; color: #fff; font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
    .container { width: 100%; max-width: 420px; }
    .logo { margin-bottom: 32px; text-align: center; }
    .logo h1 { font-size: 48px; font-weight: 900; letter-spacing: 12px; background: linear-gradient(90deg, #FF6B00 0%, #FFB800 30%, #FFFFFF 50%, #FFB800 70%, #FF6B00 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 2.5s linear infinite; }
    .logo h2 { font-size: 16px; font-weight: 300; letter-spacing: 8px; background: linear-gradient(90deg, #C0C0C0, #FFFFFF, #A0A0A0, #FFFFFF, #C0C0C0); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 3s linear infinite; }
    .logo p { font-size: 13px; color: #888; letter-spacing: 2px; margin-top: 4px; }
    .card { background: rgba(20,20,20,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 28px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 48px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), rgba(255,107,0,0.3), rgba(255,184,0,0.3), rgba(255,255,255,0.15), transparent); }
    .title { font-size: 20px; margin-bottom: 10px; }
    .description { margin-bottom: 20px; color: #8B949E; font-size: 13px; line-height: 1.6; }
    .label { font-size: 10px; letter-spacing: 3px; margin-bottom: 6px; margin-top: 16px; display: block; background: linear-gradient(90deg, #FF6B00, #FFB800); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; font-weight: 700; text-transform: uppercase; }
    input { width: 100%; background: rgba(13,13,13,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 18px; color: #F0F0F0; font-size: 15px; outline: none; transition: all 0.3s; box-shadow: inset 0 2px 8px rgba(0,0,0,0.4); }
    input:focus { border-color: #FF6B00; box-shadow: inset 0 2px 8px rgba(0,0,0,0.4), 0 0 0 3px rgba(255,107,0,0.15), 0 0 20px rgba(255,107,0,0.08); }
    .password-field { position: relative; display: flex; align-items: center; }
    .password-field input { padding-right: 92px; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #FFB800; font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #FF6B00 0%, #FFB800 50%, #FF6B00 100%); color: #0A0A0A; border: none; border-radius: 12px; padding: 16px; font-size: 13px; font-weight: 800; letter-spacing: 3px; cursor: pointer; margin-top: 20px; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { background: rgba(255,49,49,0.12); border: 1px solid rgba(255,49,49,0.4); border-radius: 12px; padding: 14px; color: #FF6B6B; font-size: 13px; margin-top: 16px; display: none; }
    .success { background: rgba(0,255,136,0.12); border: 1px solid rgba(0,255,136,0.4); border-radius: 12px; padding: 14px; color: #00FF88; font-size: 13px; margin-top: 16px; display: none; line-height: 1.6; word-break: break-word; }
    .link { text-align: center; margin-top: 20px; font-size: 13px; color: #888; cursor: pointer; }
    .link:hover { color: #FFB800; }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
    @keyframes modalIn { from { opacity:0; transform:scale(0.96) translateY(12px); } to { opacity:1; transform:scale(1) translateY(0); } }
    @keyframes overlayIn { from { opacity:0; } to { opacity:1; } }
    .modal-overlay { position: fixed; inset: 0; z-index: 99999; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; padding: 24px; animation: overlayIn 0.3s ease; }
    .modal-overlay.closing { opacity: 0; transition: opacity 0.3s ease; pointer-events: none; }
    .modal-box { background: rgba(20,20,20,0.92); backdrop-filter: blur(32px); border: 1px solid rgba(255,255,255,0.06); border-radius: 24px; max-width: 440px; width: 100%; padding: 0; box-shadow: 0 24px 80px rgba(0,0,0,0.7); position: relative; overflow: hidden; animation: modalIn 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-box.closing { opacity: 0; transform: scale(0.96) translateY(12px); transition: all 0.3s ease; pointer-events: none; }
    .modal-box::before { content: ''; position: absolute; top: 0; left: 20px; right: 20px; height: 1px; background: linear-gradient(90deg, transparent, #FF6B00, #FFB800, transparent); }
    .modal-close { position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.08); background: rgba(0,0,0,0.6); color: #666; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; transition: all 0.3s; }
    .modal-close:hover { border-color: #FF6B00; color: #FFB800; background: rgba(255,107,0,0.06); }
    .modal-icon { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 32px auto 0; font-size: 24px; border: 1px solid rgba(255,255,255,0.08); }
    .modal-icon.success { background: rgba(0,255,136,0.08); border-color: rgba(0,255,136,0.3); color: #00FF88; }
    .modal-icon.error { background: rgba(255,49,49,0.08); border-color: rgba(255,49,49,0.3); color: #FF6B6B; }
    .modal-icon.warning { background: rgba(255,184,0,0.08); border-color: rgba(255,184,0,0.3); color: #FFB800; }
    .modal-icon.info { background: rgba(255,107,0,0.08); border-color: rgba(255,107,0,0.3); color: #FF6B00; }
    .modal-body { padding: 24px 32px 32px; text-align: center; }
    .modal-title { font-size: 20px; font-weight: 700; background: linear-gradient(90deg, #FF6B00, #FFB800, #FFFFFF, #FFB800, #FF6B00); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 2.5s linear infinite; margin-top: 16px; margin-bottom: 8px; line-height: 1.3; }
    .modal-message { font-size: 14px; color: #999; line-height: 1.7; font-weight: 400; margin-bottom: 24px; }
    .modal-actions { display: flex; gap: 12px; }
    .modal-actions .btn-primary { margin-top: 0; flex: 1; }
    .modal-actions .btn-secondary { margin-top: 0; flex: 1; }
    @media (max-width: 600px) { .modal-box { border-radius: 20px; } .modal-body { padding: 20px 24px 24px; } .modal-title { font-size: 18px; } .modal-icon { width: 48px; height: 48px; font-size: 20px; margin-top: 28px; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <h2>HORIZON</h2>
      <p>Recuperação de senha</p>
    </div>

    <div class="card">
      <h3 class="title" id="pageTitle">Receber link de redefinição</h3>
      <p class="description" id="pageDescription">Informe seu email cadastrado para receber o link de redefinição.</p>

      <div id="emailField">
        <label class="label">EMAIL</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>

      <div id="passwordFields" style="display:none">
        <label class="label">NOVA SENHA</label>
        <div class="password-field">
          <input type="password" id="password" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">Mostrar</button>
        </div>
        <label class="label">CONFIRMAR SENHA</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">Mostrar</button>
        </div>
      </div>

      <div class="error" id="errorMessage"></div>
      <div class="success" id="successMessage"></div>

      <button class="btn-primary" id="submitBtn" onclick="handlePasswordRecovery()">ENVIAR LINK</button>
      <p class="link" onclick="goToLogin()">Voltar ao login</p>
    </div>
  </div>

  <script>
    const API = `${window.location.origin}/api`
    const resetToken = new URLSearchParams(window.location.search).get('token')

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId)
      if (!input || !button) return
      const shouldShow = input.type === 'password'
      input.type = shouldShow ? 'text' : 'password'
      button.textContent = shouldShow ? 'Ocultar' : 'Mostrar'
    }

    function goToLogin() {
      window.location.href = 'index.html'
    }

    if (resetToken) {
      document.getElementById('pageTitle').textContent = 'Redefinir senha'
      document.getElementById('pageDescription').textContent = 'Digite sua nova senha para concluir a redefinição.'
      document.getElementById('emailField').style.display = 'none'
      document.getElementById('passwordFields').style.display = 'block'
      document.getElementById('submitBtn').textContent = 'REDEFINIR SENHA'
    }

    async function handlePasswordRecovery() {
      const errorEl = document.getElementById('errorMessage')
      const successEl = document.getElementById('successMessage')
      const btn = document.getElementById('submitBtn')

      errorEl.style.display = 'none'
      successEl.style.display = 'none'
      btn.disabled = true
      btn.textContent = resetToken ? 'SALVANDO...' : 'ENVIANDO...'

      try {
        if (resetToken) {
          const password = document.getElementById('password').value.trim()
          const confirmPassword = document.getElementById('confirmPassword').value.trim()

          if (!password || !confirmPassword) throw new Error('Preencha todos os campos.')
          if (password.length < 6) throw new Error('A senha deve ter pelo menos 6 caracteres.')
          if (password !== confirmPassword) throw new Error('As senhas não conferem.')

          const res = await fetch(`${API}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Falha ao redefinir a senha.')

          successEl.textContent = data.message || 'Senha redefinida com sucesso.'
          successEl.style.display = 'block'
          btn.textContent = 'REDEFINIR SENHA'
          setTimeout(goToLogin, 2000)
          return
        }

        const email = document.getElementById('email').value.trim().toLowerCase()
        if (!email) throw new Error('Informe seu email.')

        const res = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha ao enviar o link de redefinição.')

        successEl.textContent = data.resetLink
          ? `Link de desenvolvimento gerado: ${data.resetLink}`
          : (data.message || 'Verifique sua caixa de entrada.')
        successEl.style.display = 'block'

        if (data.resetLink && navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(data.resetLink).catch(() => {})
        }

        btn.textContent = 'ENVIAR LINK'
      } catch (error) {
        errorEl.textContent = error.message
        errorEl.style.display = 'block'
        btn.textContent = resetToken ? 'REDEFINIR SENHA' : 'ENVIAR LINK'
      } finally {
        btn.disabled = false
      }
    }

    document.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') handlePasswordRecovery()
    })

    var MODAL_ICONS = { success: '&#10003;', error: '&#10007;', warning: '&#9888;', info: '&#9670;', confirm: '&#63;' }
    function showModal(options) {
      var type = options.type || 'info', title = options.title || '', message = options.message || ''
      var existing = document.querySelector('.modal-overlay'); if (existing) existing.remove()
      var iconHtml = '<div class="modal-icon ' + type + '">' + (MODAL_ICONS[type] || MODAL_ICONS.info) + '</div>'
      var actionsHtml = type === 'confirm'
        ? '<div class="modal-actions"><button class="btn-secondary" id="modalCancelBtn">' + (options.cancelText || 'Cancelar') + '</button><button class="btn-primary" id="modalConfirmBtn">' + (options.confirmText || 'Confirmar') + '</button></div>'
        : '<div class="modal-actions"><button class="btn-primary" id="modalOkBtn">OK</button></div>'
      var overlay = document.createElement('div')
      overlay.className = 'modal-overlay'
      overlay.innerHTML = '<div class="modal-box">' + (options.showClose !== false ? '<button class="modal-close" id="modalCloseBtn">&times;</button>' : '') + iconHtml + '<div class="modal-body"><div class="modal-title">' + title + '</div><div class="modal-message">' + message + '</div>' + actionsHtml + '</div></div>'
      document.body.appendChild(overlay)
      function closeModal() {
        overlay.classList.add('closing')
        var box = overlay.querySelector('.modal-box'); if (box) box.classList.add('closing')
        setTimeout(function () { overlay.remove(); if (options.onClose) options.onClose() }, 350)
      }
      overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal() })
      setTimeout(function () {
        var cb = document.getElementById('modalCloseBtn'); if (cb) cb.addEventListener('click', closeModal)
        var ob = document.getElementById('modalOkBtn'); if (ob) ob.addEventListener('click', closeModal)
        var cfb = document.getElementById('modalConfirmBtn'); if (cfb) cfb.addEventListener('click', function () { if (options.onConfirm) options.onConfirm(); closeModal() })
        var clb = document.getElementById('modalCancelBtn'); if (clb) clb.addEventListener('click', closeModal)
      }, 0)
    }
  </script>
</body>
</html>
