<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Horizon — Login</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <h2>HORIZON</h2>
      <p>Next-Gen Connectivity</p>
    </div>
    <div class="card">
      <label class="label">EMAIL</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
      <label class="label">SENHA</label>
      <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password">
      <div class="error" id="loginError"></div>
      <button class="btn-primary" onclick="handleLogin()">ACESSAR SISTEMA</button>
      <p class="link" onclick="goTo('register.html')">Não tem conta? Cadastre-se</p>
    </div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    if (getToken()) goTo('dashboard.html')

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value
      const password = document.getElementById('loginPassword').value
      const errorEl = document.getElementById('loginError')
      errorEl.style.display = 'none'
      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha no login')
        localStorage.setItem('token', data.token)
        localStorage.setItem('userEmail', email)
        localStorage.setItem('userName', data.user?.name || '')
        goTo('dashboard.html')
      } catch (err) {
        errorEl.textContent = err.message
        errorEl.style.display = 'block'
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin()
    })
  </script>
</body>
</html>
