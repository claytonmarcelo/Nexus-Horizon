<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Horizon - Login</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <h2>HORIZON</h2>
      <p>Next-Gen Connectivity</p>
      <p class="tagline">Sistema Premium de Conectividade</p>
    </div>
    <div class="card">
      <label class="label">EMAIL</label>
      <input type="email" id="loginEmail" placeholder="seu@email.com" autocomplete="email">
      <label class="label">SENHA</label>
      <div class="password-field">
        <input type="password" id="loginPassword" placeholder="********" autocomplete="current-password">
        <button type="button" class="password-toggle" onclick="togglePassword('loginPassword', this)">Mostrar</button>
      </div>
      <div class="error" id="loginError"></div>
      <button class="btn-primary" id="loginBtn" onclick="handleLogin()">ACESSAR SISTEMA</button>
      <p class="link" onclick="goTo('reset-password.html')">Esqueci minha senha</p>
      <p class="link" onclick="goTo('register.html')">Não tem conta? Cadastre-se</p>
    </div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    if (getToken()) goTo('dashboard.html')

    async function handleLogin() {
      const email = document.getElementById('loginEmail').value.trim().toLowerCase()
      const password = document.getElementById('loginPassword').value.trim()
      const errorEl = document.getElementById('loginError')
      const btn = document.getElementById('loginBtn')
      errorEl.style.display = 'none'

      if (!email || !password) {
        errorEl.textContent = 'Preencha todos os campos'
        errorEl.style.display = 'block'
        return
      }

      btn.disabled = true
      btn.textContent = 'ENTRANDO...'

      try {
        const res = await fetch(`${API}/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha no login')

        localStorage.setItem('token', data.token)
        localStorage.setItem('userEmail', email)
        localStorage.setItem('userName', data.user?.name || '')
        goTo('dashboard.html')
      } catch (err) {
        errorEl.textContent = err.message
        errorEl.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'ACESSAR SISTEMA'
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleLogin()
    })
  </script>
</body>
</html>
