<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0D0B09">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Nexus Horizon - Cadastro</title>
  <link rel="stylesheet" href="assets/style.css">
  <style>
    html { background: #0D0B09; min-height: 100%; }
    body { min-height: 100dvh; overscroll-behavior: none; -webkit-overflow-scrolling: touch; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <h2>HORIZON</h2>
      <p>Crie sua conta</p>
      <p class="tagline">Junte-se ao Nexus Horizon</p>
    </div>
    <div class="card">
      <label class="label">NOME</label>
      <input type="text" id="registerName" placeholder="Seu nome" autocomplete="name">
      <label class="label">EMAIL</label>
      <input type="email" id="registerEmail" placeholder="seu@email.com" autocomplete="email">
      <label class="label">SENHA</label>
      <div class="password-field">
        <input type="password" id="registerPassword" placeholder="********" autocomplete="new-password">
        <button type="button" class="password-toggle" onclick="togglePassword('registerPassword', this)">Mostrar</button>
      </div>
      <div class="error" id="registerError"></div>
      <div class="success" id="registerSuccess"></div>
      <button class="btn-secondary" id="registerBtn" onclick="handleRegister()">CRIAR CONTA</button>
      <p class="link" onclick="goTo('login.html')">Já tem conta? Faça login</p>
    </div>
  </div>
  <script src="assets/api.js"></script>
  <script>
    async function handleRegister() {
      const normalizedName = document.getElementById('registerName').value.trim()
      const normalizedEmail = document.getElementById('registerEmail').value.trim().toLowerCase()
      const normalizedPassword = document.getElementById('registerPassword').value.trim()
      const errorEl = document.getElementById('registerError')
      const successEl = document.getElementById('registerSuccess')
      const btn = document.getElementById('registerBtn')

      errorEl.style.display = 'none'
      successEl.style.display = 'none'

      if (!normalizedName || !normalizedEmail || !normalizedPassword) {
        errorEl.textContent = 'Preencha todos os campos'
        errorEl.style.display = 'block'
        return
      }

      if (normalizedPassword.length < 6) {
        errorEl.textContent = 'A senha deve ter pelo menos 6 caracteres'
        errorEl.style.display = 'block'
        return
      }

      btn.disabled = true
      btn.textContent = 'CRIANDO...'

      try {
        const res = await fetch(`${API}/auth/register`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: normalizedName,
            email: normalizedEmail,
            password: normalizedPassword,
          }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha no cadastro')

        if (data.token) {
          localStorage.setItem('token', data.token)
          localStorage.setItem('userEmail', normalizedEmail)
          localStorage.setItem('userName', data.user?.name || normalizedName)
          goTo('dashboard.html')
          return
        }

        successEl.textContent = 'Conta criada! Faça login.'
        successEl.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'CRIAR CONTA'
        setTimeout(() => goTo('login.html'), 2000)
      } catch (err) {
        errorEl.textContent = err.message
        errorEl.style.display = 'block'
        btn.disabled = false
        btn.textContent = 'CRIAR CONTA'
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleRegister()
    })
  </script>
</body>
</html>
