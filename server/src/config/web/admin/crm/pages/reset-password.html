<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Horizon - Recuperar senha</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <h2>HORIZON</h2>
      <p>Recuperação de senha</p>
      <p class="tagline">Recupere o acesso à sua conta</p>
    </div>

    <div class="card">
      <h3 id="pageTitle" style="margin-bottom: 10px; color: #fff;">Receber link de redefinição</h3>
      <p id="pageDescription" style="margin-bottom: 20px; color: #8B949E; font-size: 13px; line-height: 1.6;">
        Informe seu email cadastrado para receber o link de redefinição.
      </p>

      <div id="emailField">
        <label class="label">EMAIL</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>

      <div id="passwordFields" style="display: none;">
        <label class="label">NOVA SENHA</label>
        <div class="password-field">
          <input type="password" id="password" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">Mostrar</button>
        </div>
        <label class="label">CONFIRMAR SENHA</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">Mostrar</button>
        </div>
      </div>

      <div class="error" id="errorMessage"></div>
      <div class="success" id="successMessage"></div>

      <button class="btn-primary" id="submitBtn" onclick="handlePasswordRecovery()">ENVIAR LINK</button>
      <p class="link" onclick="goTo('login.html')">Voltar ao login</p>
    </div>
  </div>

  <script src="assets/api.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search)
    const resetToken = params.get('token')

    if (resetToken) {
      document.getElementById('pageTitle').textContent = 'Redefinir senha'
      document.getElementById('pageDescription').textContent = 'Digite sua nova senha para concluir a redefinição.'
      document.getElementById('emailField').style.display = 'none'
      document.getElementById('passwordFields').style.display = 'block'
      document.getElementById('submitBtn').textContent = 'REDEFINIR SENHA'
    }

    async function handlePasswordRecovery() {
      const errorEl = document.getElementById('errorMessage')
      const successEl = document.getElementById('successMessage')
      const btn = document.getElementById('submitBtn')

      errorEl.style.display = 'none'
      successEl.style.display = 'none'
      btn.disabled = true
      btn.textContent = resetToken ? 'SALVANDO...' : 'ENVIANDO...'

      try {
        if (resetToken) {
          const password = document.getElementById('password').value.trim()
          const confirmPassword = document.getElementById('confirmPassword').value.trim()

          if (!password || !confirmPassword) {
            throw new Error('Preencha todos os campos.')
          }

          if (password.length < 6) {
            throw new Error('A senha deve ter pelo menos 6 caracteres.')
          }

          if (password !== confirmPassword) {
            throw new Error('As senhas não conferem.')
          }

          const res = await fetch(`${API}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Falha ao redefinir a senha.')

          successEl.textContent = data.message || 'Senha redefinida com sucesso.'
          successEl.style.display = 'block'
          btn.textContent = 'REDEFINIR SENHA'
          setTimeout(() => goTo('login.html'), 2000)
          return
        }

        const email = document.getElementById('email').value.trim().toLowerCase()
        if (!email) {
          throw new Error('Informe seu email.')
        }

        const res = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha ao enviar o link de redefinição.')

        if (data.resetLink) {
          successEl.textContent = `Link de desenvolvimento gerado: ${data.resetLink}`
          if (navigator.clipboard?.writeText) {
            navigator.clipboard.writeText(data.resetLink).catch(() => {})
          }
        } else {
          successEl.textContent = data.message || 'Verifique sua caixa de entrada.'
        }

        successEl.style.display = 'block'
        btn.textContent = 'ENVIAR LINK'
      } catch (err) {
        errorEl.textContent = err.message
        errorEl.style.display = 'block'
        btn.textContent = resetToken ? 'REDEFINIR SENHA' : 'ENVIAR LINK'
      } finally {
        btn.disabled = false
      }
    }

    document.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handlePasswordRecovery()
    })
  </script>
</body>
</html>
