<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Horizon - Recuperar senha</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap');
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { background: #070A0F; color: #fff; font-family: 'Inter', 'Segoe UI', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .container { width: 100%; max-width: 420px; }
    .logo { margin-bottom: 32px; text-align: center; }
    .logo h1 { font-size: 48px; font-weight: 900; letter-spacing: 12px; background: linear-gradient(135deg, #00F5FF 0%, #7000FF 50%, #00F5FF 100%); background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; animation: shimmer 2.5s linear infinite; }
    .logo h2 { font-size: 16px; font-weight: 300; letter-spacing: 8px; background: linear-gradient(135deg, #7000FF, #00F5FF); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo p { font-size: 13px; color: #8B949E; letter-spacing: 2px; margin-top: 4px; }
    .card { background: rgba(18,22,30,0.85); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 20px; padding: 28px; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 8px 48px rgba(0,0,0,0.5); position: relative; overflow: hidden; }
    .card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, rgba(0,245,255,0.2), rgba(112,0,255,0.3), rgba(0,245,255,0.2), transparent); }
    .title { font-size: 20px; margin-bottom: 10px; }
    .description { margin-bottom: 20px; color: #8B949E; font-size: 13px; line-height: 1.6; }
    .label { font-size: 10px; letter-spacing: 3px; margin-bottom: 6px; margin-top: 16px; display: block; color: #00F5FF; font-weight: 700; text-transform: uppercase; }
    input { width: 100%; background: rgba(13,13,20,0.8); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 14px 18px; color: #F0F0F0; font-size: 15px; outline: none; transition: all 0.3s; box-shadow: inset 0 2px 8px rgba(0,0,0,0.4); }
    input:focus { border-color: #00F5FF; box-shadow: inset 0 2px 8px rgba(0,0,0,0.4), 0 0 0 3px rgba(0,245,255,0.15), 0 0 20px rgba(0,245,255,0.08); }
    .password-field { position: relative; display: flex; align-items: center; }
    .password-field input { padding-right: 92px; }
    .password-toggle { position: absolute; right: 12px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #00F5FF; font-size: 11px; font-weight: 700; letter-spacing: 1px; cursor: pointer; }
    .btn-primary { width: 100%; background: linear-gradient(135deg, #00F5FF 0%, #7000FF 50%, #00F5FF 100%); color: #0A0A0A; border: none; border-radius: 12px; padding: 16px; font-size: 13px; font-weight: 800; letter-spacing: 3px; cursor: pointer; margin-top: 20px; }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .error { background: rgba(255,49,49,0.12); border: 1px solid rgba(255,49,49,0.4); border-radius: 12px; padding: 14px; color: #FF6B6B; font-size: 13px; margin-top: 16px; display: none; }
    .success { background: rgba(0,245,255,0.12); border: 1px solid rgba(0,245,255,0.4); border-radius: 12px; padding: 14px; color: #00F5FF; font-size: 13px; margin-top: 16px; display: none; line-height: 1.6; word-break: break-word; }
    .link { text-align: center; margin-top: 20px; font-size: 13px; color: #8B949E; cursor: pointer; }
    .link:hover { color: #00F5FF; }
    @keyframes shimmer { 0% { background-position: -400px 0; } 100% { background-position: 400px 0; } }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>NEXUS</h1>
      <h2>HORIZON</h2>
      <p>Recuperação de senha</p>
    </div>

    <div class="card">
      <h3 class="title" id="pageTitle">Receber link de redefinição</h3>
      <p class="description" id="pageDescription">Informe seu email cadastrado para receber o link de redefinição.</p>

      <div id="emailField">
        <label class="label">EMAIL</label>
        <input type="email" id="email" placeholder="seu@email.com" autocomplete="email">
      </div>

      <div id="passwordFields" style="display:none">
        <label class="label">NOVA SENHA</label>
        <div class="password-field">
          <input type="password" id="password" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('password', this)">Mostrar</button>
        </div>
        <label class="label">CONFIRMAR SENHA</label>
        <div class="password-field">
          <input type="password" id="confirmPassword" placeholder="********" autocomplete="new-password">
          <button type="button" class="password-toggle" onclick="togglePassword('confirmPassword', this)">Mostrar</button>
        </div>
      </div>

      <div class="error" id="errorMessage"></div>
      <div class="success" id="successMessage"></div>

      <button class="btn-primary" id="submitBtn" onclick="handlePasswordRecovery()">ENVIAR LINK</button>
      <p class="link" onclick="goToLogin()">Voltar ao login</p>
    </div>
  </div>

  <script>
    const localHostNames = ['localhost', '127.0.0.1', '::1']
    let API = localHostNames.includes(window.location.hostname)
      ? 'http://localhost:3333/api'
      : window.location.origin + '/api'
    const REMOTE_API = 'https://nexus-horizon.onrender.com/api'
    const resetToken = new URLSearchParams(window.location.search).get('token')

    async function detectApiUrl() {
      const urls = [
        'http://localhost:3333/api',
        'http://127.0.0.1:3333/api',
        'http://' + window.location.hostname + ':3333/api',
        window.location.origin + '/api',
        '/api',
        REMOTE_API,
      ]

      for (const url of urls) {
        try {
          const healthUrl = `${url.replace(/\/api$/, '')}/health`
          const response = await fetch(healthUrl, {
            method: 'GET',
            cache: 'no-store',
            signal: AbortSignal.timeout(2000),
          }).catch(() => null)

          if (response?.ok) {
            API = url
            return url
          }
        } catch (error) {}
      }

      API = REMOTE_API
      return API
    }

    function togglePassword(inputId, button) {
      const input = document.getElementById(inputId)
      if (!input || !button) return
      const shouldShow = input.type === 'password'
      input.type = shouldShow ? 'text' : 'password'
      button.textContent = shouldShow ? 'Ocultar' : 'Mostrar'
    }

    function goToLogin() {
      window.location.href = 'index.html'
    }

    if (resetToken) {
      document.getElementById('pageTitle').textContent = 'Redefinir senha'
      document.getElementById('pageDescription').textContent = 'Digite sua nova senha para concluir a redefinição.'
      document.getElementById('emailField').style.display = 'none'
      document.getElementById('passwordFields').style.display = 'block'
      document.getElementById('submitBtn').textContent = 'REDEFINIR SENHA'
    }

    async function handlePasswordRecovery() {
      const errorEl = document.getElementById('errorMessage')
      const successEl = document.getElementById('successMessage')
      const btn = document.getElementById('submitBtn')

      errorEl.style.display = 'none'
      successEl.style.display = 'none'
      btn.disabled = true
      btn.textContent = resetToken ? 'SALVANDO...' : 'ENVIANDO...'

      try {
        await detectApiUrl()

        if (resetToken) {
          const password = document.getElementById('password').value.trim()
          const confirmPassword = document.getElementById('confirmPassword').value.trim()

          if (!password || !confirmPassword) throw new Error('Preencha todos os campos.')
          if (password.length < 6) throw new Error('A senha deve ter pelo menos 6 caracteres.')
          if (password !== confirmPassword) throw new Error('As senhas não conferem.')

          const res = await fetch(`${API}/auth/reset-password`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ token: resetToken, password }),
          })
          const data = await res.json()
          if (!res.ok) throw new Error(data.error || 'Falha ao redefinir a senha.')

          successEl.textContent = data.message || 'Senha redefinida com sucesso.'
          successEl.style.display = 'block'
          btn.textContent = 'REDEFINIR SENHA'
          setTimeout(goToLogin, 2000)
          return
        }

        const email = document.getElementById('email').value.trim().toLowerCase()
        if (!email) throw new Error('Informe seu email.')

        const res = await fetch(`${API}/auth/forgot-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email }),
        })
        const data = await res.json()
        if (!res.ok) throw new Error(data.error || 'Falha ao enviar o link de redefinição.')

        successEl.textContent = data.resetLink
          ? `Link de desenvolvimento gerado: ${data.resetLink}`
          : (data.message || 'Verifique sua caixa de entrada.')
        successEl.style.display = 'block'

        if (data.resetLink && navigator.clipboard?.writeText) {
          navigator.clipboard.writeText(data.resetLink).catch(() => {})
        }

        btn.textContent = 'ENVIAR LINK'
      } catch (error) {
        errorEl.textContent = error.message
        errorEl.style.display = 'block'
        btn.textContent = resetToken ? 'REDEFINIR SENHA' : 'ENVIAR LINK'
      } finally {
        btn.disabled = false
      }
    }

    document.addEventListener('keypress', (event) => {
      if (event.key === 'Enter') handlePasswordRecovery()
    })
  </script>
</body>
</html>
